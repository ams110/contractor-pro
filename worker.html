<!DOCTYPE html>
<!--
  ═══ بوّابة العامل — تطبيق منفصل ═══════════════════════════════════════════════
  وثيقة مستقلّة تماماً عن `index.html` (تطبيق المالك): manifest خاص، أيقونة خاصة،
  scope محصور بـ/worker، وحزمة JS ما فيها كود تطبيق المالك إطلاقاً. تُخدَم على
  `/worker` عبر rewrite في `vercel.json`.
  ⚠️ لا تضيف هنا أي استيراد من `App.jsx` — الهدف أنّ العامل ما يقدر يهبط أبداً
  على تطبيق المالك من رابط بوّابته (كانت هاي المشكلة قبل الفصل).
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="بوّابتي" />
  <!-- بوّابة خاصة بالعمّال — لا تُفهرَس أبداً -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- manifest/أيقونات البوّابة (منفصلة عن تطبيق المالك) -->
  <link rel="manifest" href="/worker.webmanifest" />
  <link rel="icon" href="/worker-favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/worker-pwa-192.png" />
  <link rel="apple-touch-icon" href="/worker-apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/worker-apple-touch-icon.png" />

  <title>بوّابة العامل | كبلان</title>
  <meta name="description" content="بوّابة العامل في كبلان: كشف حسابك، أيام عملك، مصاريفك، وطلب راتب أو سلفة." />

  <!-- ===== الخطوط (تحميل غير حاجب للرسم) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Noto+Sans+Hebrew:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Noto+Sans+Hebrew:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Noto+Sans+Hebrew:wght@400;500;600;700;800;900&display=swap" /></noscript>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; min-height: 100dvh; background: #07080F; font-family: 'Segoe UI', Tahoma, sans-serif; color: #F8FAFC; direction: rtl; overflow-x: hidden; overscroll-behavior-y: none; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    input, select, button, textarea { font-family: inherit; }
    #root { min-height: 100%; min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="root">
    <noscript>هذه البوّابة تتطلّب تفعيل JavaScript للعمل.</noscript>
  </div>
  <script type="module" src="/src/worker-main.jsx"></script>
</body>
</html>
